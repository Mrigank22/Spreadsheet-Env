[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsheet-finmodel-env"
version = "0.2.0"
description = "OpenEnv RL environment: build, repair and value spreadsheet financial models (three-statement, DCF, LBO, project finance, ABS, fund waterfalls, tax, credit) from term sheets or generated legal documents, graded by metamorphic recalculation, accounting identities and dependency-graph checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["rl-environment", "openenv", "llm", "grpo", "spreadsheet", "financial-modeling", "rlvr"]
dependencies = [
    "openenv>=0.9.0,<0.11",
    "fastmcp>=3,<4",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
train = ["trl>=1.16", "transformers>=5", "peft>=0.21", "accelerate>=1", "datasets>=3", "torch>=2.4"]
agents = ["anthropic>=0.70"]
crosscheck = ["formualizer==0.12.0", "ironcalc==0.9.1"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[project.scripts]
spreadsheet-env-server = "spreadsheet_env.server.app:main"

[tool.setuptools.packages.find]
include = ["spreadsheet_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"  # pytest-xdist: one test worker per CPU core
