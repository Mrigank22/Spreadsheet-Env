spec_version: 1
name: spreadsheet-financial-model
version: 0.2.0
type: space
runtime: fastapi
app: spreadsheet_env.server.app:app
port: 8000
description: >
  Multi-turn tool-use environment where an LLM agent builds, repairs and values
  spreadsheet financial models: three-statement models, DCF with sensitivity
  grid and free-layout builds, plus a frontier tier of 13 finance domains (LBO,
  fund waterfalls, project finance, ABS, SaaS, VC exits, FX consolidation, tax
  provision, credit losses, and models specified by generated credit
  agreements, LPAs, indentures and charters). Rewards come from a deterministic grader: golden
  recalculation under coverage-selected input perturbations, reference-free
  accounting identities and metamorphic relations, and dependency-graph checks
  (hard-codes, balancing plugs). No LLM judge.
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 1.0
    memory_mb: 1024
    disk_mb: 256
    episode_timeout_s: 600.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [finance, spreadsheet, financial-modeling, tool-use, rlvr, rl-environment]
